# ============================================================================
# "dev" profile — the default for `mvn spring-boot:run` with no flags.
# Fully offline: in-memory H2, no network, no Supabase connections. Use this
# for day-to-day local development so you never compete with Render's
# production deployment for Supabase's free-tier pooler (EMAXCONNSESSION).
#
# To run against the real Supabase Postgres instead, use:
#     mvn spring-boot:run -Dspring-boot.run.profiles=local
# ============================================================================

spring.datasource.url=jdbc:h2:mem:scirs_dev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Dev-only fixed secret so the app starts without needing a .env file.
# NEVER used against a real database — JwtUtil refuses to start with an
# empty secret, this just satisfies that for the offline profile.
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-do-not-use-in-production-0123456789}

app.mail.enabled=false
app.mock-data.enabled=${SEED_MOCK_DATA:true}
