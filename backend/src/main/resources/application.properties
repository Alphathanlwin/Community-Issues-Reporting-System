# ============================================================================
# SCIRS — Smart Community Issue Report System
# Default Spring Boot configuration (safe to commit — no real secrets).
#
# Local development credentials belong in application-local.properties
# (git-ignored) or in a .env file (git-ignored, auto-loaded below). Activate
# the local profile with:
#     java -jar scirs.jar --spring.profiles.active=local
# Environment variables always override the defaults defined below.
# ============================================================================

# Auto-load a git-ignored backend/.env file in the working directory, if it
# exists (optional: — missing file never fails startup).
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------- Server ----
server.port=${SERVER_PORT:8080}

# ------------------------------------------------------------ Database ------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scirs_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------ JPA/Hibernate --
# update = Hibernate auto-ddl from entity annotations (dev only; generate a
# final SQL script for the submission per library-docs.md)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------- Jackson ----
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------------------------------------------------------------- Seeding ----
# Seeded admin account (idempotent — DataSeeder skips creation if it exists)
app.admin.email=${ADMIN_EMAIL:admin@scirs.gov}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

# ------------------------------------------------------------------- JWT -----
# 24-hour expiry (milliseconds). Secret MUST be supplied via the local profile
# or JWT_SECRET — the app will not start with an empty secret.
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ------------------------------------------------------------ File upload ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
# Storage provider: local (default/dev/demo) | supabase
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.local-path=./uploads
app.supabase.url=${SUPABASE_URL:}
app.supabase.bucket=report-images
app.supabase.service-key=${SUPABASE_SERVICE_KEY:}

# ------------------------------------------------------ Mail (SendGrid) ------
spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=apikey
spring.mail.password=${SENDGRID_API_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=noreply@scirs.gov
app.mail.enabled=${MAIL_ENABLED:false}

# ------------------------------------------------------------------- CORS ----
# Frontend origin only (see architecture.md security rules)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ----------------------------------------------------------------- Logging ----
logging.level.com.uit.scirs=INFO