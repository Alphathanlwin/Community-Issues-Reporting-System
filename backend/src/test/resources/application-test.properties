# ============================================================================
# Test profile — in-memory H2, never points at the development database.
# ============================================================================

spring.datasource.url=jdbc:h2:mem:scirs_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# application.properties pins hibernate.dialect to PostgreSQLDialect for prod
# startup resilience; that raw Hibernate property outranks database-platform,
# so without this override the tests run PostgreSQL SQL (INSERT ... RETURNING)
# against H2 and every @SpringBootTest write fails.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=test-only-secret-key-long-enough-for-hs256-signing
jwt.expiration=3600000

# Tests build their own fixtures — never run the demo seeder, even when a
# local backend/.env (imported by application.properties) sets SEED_MOCK_DATA=true.
# Its citizen1..citizen9@example.com accounts otherwise collide with the
# fixtures in ReportControllerIntegrationTest.
app.mock-data.enabled=false

app.cors.allowed-origins=http://localhost:5173
app.admin.email=admin@scirs.gov
app.admin.password=Admin@12345
app.mail.enabled=false

app.storage.provider=local
app.storage.local-path=${java.io.tmpdir}/scirs-test-uploads
