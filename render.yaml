# Render Blueprint — https://render.com/docs/blueprint-spec
# In the Render dashboard: New > Blueprint > pick this repo. Render reads this
# file, creates the service below, and stops to let you fill in every env var
# marked `sync: false` (secrets — never put real values in this committed file).
services:
  - type: web
    name: scirs-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      # ---- Database (Supabase Postgres, or any Postgres 15+) ----
      - key: SPRING_DATASOURCE_URL
        sync: false # jdbc:postgresql://HOST:PORT/DB?sslmode=require&prepareThreshold=0 — see BUG-06 in docs/bug-log.md for why prepareThreshold=0 is required against Supabase's pooler
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

      # ---- JWT ----
      - key: JWT_SECRET
        generateValue: true # Render generates a random secret; the app also refuses to start with an empty one
      - key: JWT_EXPIRATION
        value: "86400000"

      # ---- Seeded admin account ----
      - key: ADMIN_EMAIL
        value: admin@scirs.gov
      - key: ADMIN_PASSWORD
        sync: false # set a real password before going live — this is not a placeholder

      # ---- CORS — your deployed frontend's origin, once you have one ----
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # ---- Storage ----
      # "local" writes to the container's disk, which is EPHEMERAL on Render's
      # free plan — every uploaded image is lost on redeploy/restart unless you
      # attach a paid Render Disk, or switch this to "supabase" and fill in the
      # two keys below (SupabaseStorageService isn't built yet — see
      # progress-tracker.md; app.storage.provider defaults to "local" either way).
      - key: STORAGE_PROVIDER
        value: local
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

      # ---- Mail (optional — off by default) ----
      - key: MAIL_ENABLED
        value: "false"
      - key: SENDGRID_API_KEY
        sync: false

      # ---- Demo data — leave false; see docs/bug-log.md / MockDataSeeder ----
      - key: SEED_MOCK_DATA
        value: "false"
